name: CI

on:
  pull_request:
  # `main` is v2's branch in this same repository, and a workflow runs from the
  # tree it was pushed with — so listing main here would never fire this file,
  # only v2's own.
  push:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      # No Python version here: .python-version already pins it, and a second
      # copy is a second thing to keep in step.
      - name: Sync the uv environment
        run: uv sync --locked

      # This line is the gate — there is no second copy of it in a noxfile or a
      # README, so a contributor runs these four or reads them here. `ruff
      # format --check` is separate from `ruff check` and green on one says
      # nothing about the other; it is in the list because a configured
      # formatter that nothing enforces means the next person to run it emits a
      # diff unrelated to their change, and the version it enforces is pinned
      # exactly in `pyproject.toml` so the answer does not move on a lock
      # refresh. Its `.` is Python only: ruff would otherwise format the
      # fenced Python in every document, and `pyproject.toml`'s
      # `extend-exclude` is where that is refused, with the reason.
      # Nothing here has
      # to be installed for `lint-imports` to have an opinion about it — grimp
      # reads import statements, not the environment
      # (findings/2026.08.06-every-contract-goes-red-on-one-line.md), so Qt is
      # absent and OpenCV is present only because the video fixture writes an
      # mp4, and neither fact weakens a contract.
      #
      # `actionlint` is the one member whose subject is this file. It is on the
      # line rather than a sixth step below because a step cannot check the
      # workflow it is a step of: `runs-on: ubuntu-latests` is what actionlint
      # catches and also what stops the job that would have run it. On the line
      # it runs on a laptop before the push, which is the only place that error
      # is catchable at all. It takes no path argument — it discovers every
      # workflow under `.github/` from the repo root, so a second workflow file
      # is covered by existing without anyone updating a list here. What it
      # costs the four checks that cannot fail on a `.github/`-only commit is
      # 0.7% of the gate
      # (findings/2026.08.07-actionlint-is-seven-tenths-of-a-percent-of-the-gate.md),
      # and that measurement is why it is here and not behind a `paths:` entry
      # that would have been a second copy of the gate's membership.
      - name: Run the gate
        run: uv run ruff check . && uv run ruff format --check . && uv run lint-imports && uv run pytest -q && uv run actionlint
