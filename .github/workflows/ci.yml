name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt offscreen runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Create and sync the uv environment
        run: |
          uv venv sieve --python 3.11
          uv pip install --python ./sieve/bin/python -e ".[dev]"

      - name: Run the supported CI sessions
        run: ./sieve/bin/python -m nox -s checks benchmark
