name: CI

on:
  pull_request:
  # `main` is v2's branch in this same repository, and a workflow runs from the
  # tree it was pushed with — so listing main here would never fire this file,
  # only v2's own.
  push:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      # The PySide6 wheel carries Qt's own libraries but not the system ones
      # they link against, and the runner image has no desktop stack. These five
      # are what `libQt6Gui` resolves against before the offscreen platform
      # plugin can load at all — a `tests/gui/` session without them dies at the
      # first `QApplication` with "could not load the Qt platform plugin", which
      # is a red about the runner and not about the tree.
      - name: Install the libraries offscreen Qt links against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # No Python version here: .python-version already pins it, and a second
      # copy is a second thing to keep in step.
      - name: Sync the uv environment
        run: uv sync --locked

      # This line is the gate, and it lives only here
      # (adr/the-gate-is-one-line.md); what may join it is
      # adr/a-check-joins-the-gate-line.md, so a sixth command is argued
      # against those three clauses here rather than from scratch again.
      #
      # `ruff format --check` is separate from `ruff check` and green on one
      # says nothing about the other; without it a configured formatter that
      # nothing enforces means the next person to run it emits a diff
      # unrelated to their change, and the version it enforces is pinned
      # exactly in `pyproject.toml` so the answer does not move on a lock
      # refresh. Its `.` is Python only: ruff would otherwise format the
      # fenced Python in every document, and `pyproject.toml`'s
      # `extend-exclude` is where that is refused, with the reason.
      # Nothing here has
      # to be installed for `lint-imports` to have an opinion about it — grimp
      # reads import statements, not the environment
      # (findings/2026.08.06-every-contract-goes-red-on-one-line.md). That is
      # why the `headless` contract kept its force through the phases when Qt
      # was not installed here, and why it still has exactly the same force now
      # that `gui/` has put it in the lock file.
      #
      # `actionlint` is the one member whose subject is this file, and the one
      # the membership rule was written against
      # (findings/2026.08.07-actionlint-is-seven-tenths-of-a-percent-of-the-gate.md).
      # It takes no path argument — it discovers every workflow under
      # `.github/` from the repo root, so a second workflow file is covered by
      # existing without anyone updating a list here.
      - name: Run the gate
        run: uv run ruff check . && uv run ruff format --check . && uv run lint-imports && uv run pytest -q && uv run actionlint
