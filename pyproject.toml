[project]
name = "sieve"
version = "0.4.0"
description = "SIEVE isolates ethological events from video."
requires-python = ">=3.13"
# numpy is here because the canonical construction is the substrate's
# (`sieve/contract/forms.py`): two producers of one form must agree in the low
# bits, so the shaping cannot live in each tool. It is not a decode library.
#
# av is here for `sieve/chunks.py` and for nothing else: SIEVE's own cut, of
# frames it already held, in a form it named. It never opens a source — which
# container a recording is in stays the tool's opinion, which is the boundary
# ADR-0009 draws. The line to watch is a source suffix or a demux appearing in
# `sieve/`; that is the prohibition, and the dependency is not.
dependencies = [
    "PySide6>=6.8",
    "numpy>=2",
    "av>=13",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
]
# What the bundled tools need and SIEVE does not. A source tool's decoder is
# the tool's dependency, which is what keeps the note below true while a file
# still opens.
tools = [
    "av>=13",
    "opencv-python-headless>=4.10",
]
# What the experiments compare, which is not what SIEVE runs on. The point
# stands even though `av` is now a runtime dependency: SIEVE picked a codec for
# its own cut, measured
# (`docs/findings/2026.08.21-lossy-intra-beats-lossless-for-the-cut.md`), and
# picked no winner for reading anybody's recording. A contestant installed by
# default would be one the application had chosen to *decode sources* with, and
# it has not — `sieve/` names no container and demuxes nothing.
experiments = [
    "av>=13",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
]

[project.scripts]
sieve = "sieve.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

# One contract per ADR, named for it — the convention is checks/__init__.py.
[tool.importlinter]
root_packages = ["sieve", "checks", "tools"]
contract_types = ["adr0010_key_version: checks.adr0010.KeyVersionContract"]

# ADR-0009's two prohibitions, which fail differently. The first is the one
# nobody violates by accident; the second is the one that happens because the
# internal was right there, and it is the one that freezes the substrate.
[[tool.importlinter.contracts]]
name = "ADR-0009: SIEVE never names a tool"
type = "forbidden"
source_modules = ["sieve"]
forbidden_modules = ["tools"]

[[tool.importlinter.contracts]]
name = "ADR-0009: a tool never reaches past the contract"
type = "forbidden"
source_modules = ["tools"]
forbidden_modules = [
    "sieve.gui",
    "sieve.project",
    "sieve.settings",
    "sieve.relaunch",
    "sieve.registry",
    "sieve.__main__",
]

# The role slot stays open by the registry not being able to name a role.
# It was documented open and gated shut — `isinstance(tool.role, Source)` —
# so a tool filling any other contracted role was dropped at load and
# reported as malformed. `Tool.kind` is the question to ask; a file that
# cannot import the class cannot go back to asking the other one.
[[tool.importlinter.contracts]]
name = "the registry never names a role"
type = "forbidden"
source_modules = ["sieve.registry"]
forbidden_modules = ["sieve.contract.nodes"]
# direct only: `Tool` lives in `sieve.contract`, which imports nodes itself,
# so the transitive path is every importer of `Tool` and forbidding it would
# forbid the contract. What must not happen is this file naming the module.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "the GUI never imports the orchestrator"
type = "forbidden"
source_modules = ["sieve.gui"]
forbidden_modules = [
    "sieve.chunks",
    "sieve.fill",
    "sieve.pipeline",
    "sieve.proxy",
    "sieve.serve",
    "sieve.store",
]
ignore_imports = [
    "sieve.session -> sieve.chunks",
    "sieve.session -> sieve.fill",
    "sieve.session -> sieve.pipeline",
    "sieve.session -> sieve.proxy",
    "sieve.session -> sieve.serve",
    "sieve.session -> sieve.store",
]

# The tools that run, not only the ones that were measured. This watched the
# experiment alone until a series was keyed by a step's version, at which point
# an unaffirmed edit to `tools/` became silent staleness with a store behind
# it — the exact failure the ADR exists to prevent, in the one place it was
# unguarded.
[[tool.importlinter.contracts]]
name = "ADR-0010: a key carries a version"
type = "adr0010_key_version"
# Globs, not a list of files: a contract that names its files misses the next
# one added, which is the shape of hole this edit exists to close.
tools_files = [
    "tools/*.py",
    "experiments/tool-experiments/tools.py",
]
baseline_file = "checks/adr0010-baseline.json"
