[project]
name = "sieve"
version = "0.1.0"
description = "Signal Isolation for Ethological Video Events"
requires-python = ">=3.13,<3.14"
# A dependency arrives with the component that needs it, with the reason for
# the pin next to it — v2's pyproject is the model for that habit, not for this
# list.
dependencies = [
    # `core/types.py` types the frame array it carries, so the shipped package
    # imports numpy from the first module. 2.x because the types name
    # `numpy.typing.NDArray` and `np.dtype[Any]`, both of which changed shape
    # under 2.0's typing rework.
    "numpy>=2.0",
    # `core/tool_base.py`'s params model is a pydantic model: the one field list
    # the GUI, the CLI, YAML, and the cache key all read. 2.x because
    # `model_fields`, `model_dump(mode="json")` and `ConfigDict` are the v2
    # spellings and all three are 2.x-only.
    "pydantic>=2",
    # `mutual/machine.py` reads CPU affinity and per-process RSS through it, on
    # the shipped path rather than in a test: every consumer that declares a
    # share of the machine declares it against that reading. Not a dev-group
    # entry for that reason. Unpinned beyond a floor because the two calls used
    # — `Process.cpu_affinity` and `memory_info().rss` — predate 5.x and the
    # module already treats a platform that refuses either as a fallthrough
    # rather than an error.
    "psutil>=5.9",
    # `core/pipeline_model.py` reads and writes the saved project. On the
    # shipped path rather than in a test: the document is the cluster handoff,
    # so a headless install that cannot parse one cannot run at all. It was a
    # dev-group entry while only `scripts/doc_index.py` read frontmatter, and
    # moves here with its first shipped consumer.
    "pyyaml",
    # `decode/reader.py` drives `VideoCapture`, and it is the only module
    # allowed to — decoder identity is one string precisely because one package
    # holds the decoder. Promoted from the dev group with that module, as the
    # entry there always said it would be.
    #
    # Pinned below 5.x: `decoder_identity()` puts the OpenCV version into the
    # cache key, so a major bump changes what every cached result means. That is
    # the intended behaviour, and it is a decision to take deliberately rather
    # than by resolver.
    "opencv-python-headless>=4.10,<5",
    # `storage/crop_writer.py` encodes FFV1 through it, and `decode/reader.py`
    # reads one container header through it: `container_rate` probes
    # `avg_frame_rate`, because `CAP_PROP_FPS` is a double and 30000/1001 does
    # not survive the round trip. No frame is ever decoded here — every pixel
    # still comes from OpenCV — which is what keeps this from becoming a second
    # decoder identity. A `container.decode(...)` anywhere in `sieve` is where
    # that stops holding.
    "av>=13",
    # `cli/app.py` parses the command line with it. Typer builds the option
    # list out of the command function's own annotated signature, so `sieve run
    # --help` and the signature cannot disagree — which is the property v2's
    # CLI was written against and the reason this is a port rather than a
    # rewrite onto argparse. `typer.testing.CliRunner` is also what drives the
    # command in-process in `tests/integration/test_cli_run.py`, so a headless
    # install that omitted it could not run the CLI's own tests.
    #
    # Floored at 0.12: the port uses `Annotated[T, typer.Option(...)] = default`
    # throughout, and 0.12 is where that became the only supported spelling
    # rather than one of two that disagreed about where the default lives.
    "typer>=0.12",
    # `tools/detect.py`'s Morlet transform runs on `scipy.fft`, and the three
    # properties it is chosen for are all load-bearing rather than incidental:
    # it keeps a float32 series in single precision (complex64, half the memory
    # traffic), `next_fast_len` pads a prime frame count away from Bluestein,
    # and the transform's zero-pad length is derived from it. `numpy.fft` has
    # none of the three and v1 measured the difference at ~10x on a `(T, B)`
    # series — and switching would move every band-power value, which is what
    # the detect goldens pin.
    #
    # Floored where v2 floors it. The version is not in a cache key: unlike
    # OpenCV, whose major bump changes what a decoded frame *is*, this is
    # arithmetic over an array the graph already produced, and the pin that
    # matters for it is the tool's declared version.
    "scipy>=1.14",
]

# One command, and the console script exists from the first one: `sieve run`
# executed headless beside the saved file *is* the cluster handoff (VISION), so
# a build that only works through `python -m` would not be the handoff.
[project.scripts]
sieve = "sieve.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    # Exact, unlike every other pin here, because ruff's formatter decides what
    # the committed tree *is* rather than what it may import: a floor lets a
    # routine `uv lock` refresh restyle files nobody edited, which is how this
    # tree drifted out of `format --check` for two commits under four separate
    # items. `==` makes a style change an edit with a commit behind it, and it
    # is also what keeps a verbatim-ported module format-clean until someone
    # deliberately bumps the number.
    "ruff==0.16.1",
    "import-linter>=2.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# `from ...machine import available_cpus as available_cpus` is a re-export, not
# a slip: `prefetch.py`'s own comment says callers ask it how many decode
# threads a machine supports. The file ports verbatim, so the rule bends here
# rather than the file.
"src/sieve/decode/prefetch.py" = ["PLC0414"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is a package (the empty `__init__.py` files) and the repo root is on
# the path, so a test can import a sibling's constants —
# `tests/integration/test_decode.py` asserts against the fixture's declared
# width, height, and rate rather than restating them, and a fixture that drifts
# from what a test expects should break the test, not silently pass it.
pythonpath = ["."]
# `-p pytester`: `tests/test_fixture_gate.py` asserts on the exit code of a
# whole pytest session, which nothing inside a session can observe about
# itself. The plugin ships with pytest and is opt-in only because it is a
# fixture nothing else should reach for.
addopts = "--strict-markers --strict-config -p pytester"
