[project]
name = "sieve"
version = "0.1.0"
description = "Signal Isolation for Ethological Video Events"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.0",
    "annotated-types",
    "pyyaml",
    "typer",
    "opencv-python-headless>=4.10,<5",
    "av>=13",
    "psutil>=5.9",
]

[project.scripts]
sieve = "sieve.cli.app:main"
sieve-gui = "sieve.gui.app:main"

[project.optional-dependencies]
gui = [
    "PySide6",
]
[dependency-groups]
dev = [
    "pyright",
    "import-linter>=2.13",
    "types-psutil",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
