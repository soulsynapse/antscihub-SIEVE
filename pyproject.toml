[project]
name = "sieve"
version = "0.1.0"
description = "Signal Isolation for Ethological Video Events"
requires-python = ">=3.13,<3.14"
# Empty because no component is scoped yet. A dependency arrives with the
# component that needs it, with the reason for the pin next to it — v2's
# pyproject is the model for that habit, not for this list.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # scripts/doc_index.py reads item frontmatter; the first dependency, and it
    # arrives with the machinery that needs it.
    "pyyaml",
    "import-linter>=2.13",
    # The synthetic video fixture writes and reads back an mp4. Both sit in the
    # dev group and not in `dependencies` because no shipped component decodes
    # anything yet; `sieve.decode` promotes them in Phase 2. Headless because
    # the runner has no display and the GUI build would drag Qt's system libs
    # in behind a contract that forbids them.
    #
    # Pinned below 5.x already: decoder identity feeds cache-key derivation, so
    # a major OpenCV bump changes what a cached result means. Carrying v2's pin
    # from the first install is cheaper than loosening it and re-tightening it
    # when the frames start mattering.
    "opencv-python-headless>=4.10,<5",
    "numpy>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
