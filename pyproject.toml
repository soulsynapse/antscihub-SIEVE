[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antscihub-sieve"
version = "0.1.0.dev0"
description = "Signal isolation for ethological video without training data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kendrick Nakamura" }]

# [OPEN QUESTION] No `license` field and no LICENSE file. ADR-001 selects
# PySide6 specifically so the project is not bound by PyQt6's GPLv3, which
# means the license is a decision already half-made and not yet written down.
# Declaring one here would be inventing it. See NOTES.md.

# Runtime dependencies are the set a headless run needs. Qt and the GPU
# backend are extras because ARCHITECTURE.md 3 guarantees that CLI and HPC
# runs reach the same code without a GUI toolkit, and ADR-016 requires the
# controller to import and run without CuPy or CUDA.
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",   # ADR-018: the pinned decode path
  "pydantic>=2.7",                  # ADR-004: the filter contract
  "pydantic-settings>=2.2",         # ADR-006: application config
  "typer>=0.12",                    # ADR-006: CLI
  "structlog>=24.1",                # ADR-007: structured logging
  "PyYAML>=6.0",                    # ADR-005: pipeline files
  "array-api-compat>=1.7",          # ADR-011: portable kernels
  "zarr>=3,<4",                     # ADR-014: format 3 only
  "pyarrow>=16",                    # ADR-013: Parquet is authoritative
  "duckdb>=1.0",                    # ADR-013: query engine over the Parquet
]

[project.optional-dependencies]
# ADR-019 states the rule that generates this whole section. A package belongs
# in `dependencies` above when a CLI or HPC run with no display and no GPU
# would fail without it; everything else is an extra named for the capability
# it adds.
#
# The rule is derived rather than invented. ARCHITECTURE.md 3 calls the layer
# model "the mechanism that makes CLI and HPC parity real rather than
# aspirational", and ADR-016 requires the controller to import and run without
# CuPy or CUDA. Both are claims about what a process can do with a package
# absent, and installing that package by default does not falsify the claim --
# it stops anyone from observing it. `nox -s checks` builds from `dev` alone
# for exactly that reason.
#
# The forcing case is pytest-qt, in `dev-gui` below and deliberately not in
# `dev`. See ADR-019 before moving anything between these lists.

# ADR-001. PyQt6 is what the environment currently carries; the ADR selects
# PySide6 for licensing and requires the napari embedding to be revalidated
# against it before first production use. See NOTES.md.
gui = [
  "PySide6>=6.7",
  "napari>=0.5",
  "pyqtgraph>=0.13",
]

# ADR-016. One CUDA variant per environment; the wheel name is environment
# specific, so this extra names the family and the environment picks the build.
gpu = [
  "cupy-cuda12x>=13.0",
]

# Tools whose version decides a gate outcome are pinned exactly, because
# `uv pip install -e ".[dev]"` resolves constraints and is not lock-exact
# (ADR-012). A floating linter would let the gate change without a commit.
# Libraries whose drift shows up as a test failure rather than as a silent
# verdict change carry floors instead.
dev = [
  "nox==2026.7.11",                 # ADR-009
  "ruff==0.16.0",                   # ADR-003
  "pyright==1.1.411",               # ADR-003
  "import-linter==2.13",            # layer contract, ARCHITECTURE.md 3
  "pytest>=8.0",                    # ADR-008
  "pytest-benchmark>=4.0",          # ADR-008
  "hypothesis>=6.100",              # ADR-008
  "viztracer>=0.16",                # ADR-010
  "py-spy>=0.3.14",                 # ADR-010
]

# pytest-qt is a plugin that errors at collection time when no Qt binding is
# importable, so it cannot live in `dev` without making a headless install
# unable to start pytest at all. Keeping it here is what lets `dev` stay the
# environment a CLI or HPC contributor actually needs.
dev-gui = [
  "antscihub-sieve[dev,gui]",
  "pytest-qt>=4.4",                 # ADR-008
]

# [INTENT] No console entry points are declared. cli/ and gui/ hold no module
# to point at, and a declared script naming a module that does not exist is the
# failure mode this file is replacing. They land with the commit that creates
# the entry module.

[project.urls]
Homepage = "https://github.com/soulsynapse/antscihub-SIEVE"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.ruff]
line-length = 100
target-version = "py311"
preview = false                     # ADR-003: the gate uses stable behaviour

# Ruff reformats Python code blocks inside Markdown. ADR-003 scopes it to
# Python source and says explicitly that it is not the gate for Markdown
# prose, and the specification documents use snippet layout deliberately --
# aligned trailing comments and expanded stubs carry meaning there that the
# formatter collapses. Documentation tooling is a separate decision.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
# The comparison harnesses are executable experiments and standing evidence for
# ADR-001 and ADR-018, re-runnable rather than trusted from a table. Three
# rules do not fit that shape:
#   PLC0415  importing a candidate backend inside the probe is the measurement.
#            Hoisting the imports would make one missing backend fail the run.
#   E501     the report writers emit markdown table rows and prose bullets as
#            literals; a table row has no legal wrap point.
#   PLR2004  the magic values are bit depths and sample counts that read more
#            clearly inline than behind a name.
# These are targeted exceptions to a rule that does not fit, not a relaxed
# baseline: library code under src/ outside bench/ gets the full set.
"src/sieve/bench/*" = ["PLC0415", "E501", "PLR2004", "PLR0913", "PLR0915"]
"tests/benchmark_*.py" = ["PLC0415", "E501", "PLR2004", "PLR0913", "PLR0915"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "tools", "noxfile.py"]
exclude = ["**/__pycache__", ".venv", "tests/results", "videos-testing"]
strict = ["src/sieve/core", "src/sieve/pipeline"]  # strict where it matters
# The comparison harnesses reach through third-party surfaces that carry weak
# or dynamic typing -- PyAV frame planes, pyqtgraph and napari attribute
# construction. Their diagnostics are artifacts of those stubs rather than
# defects, and suppressing them here is what lets the gate be green and
# therefore mean something. They stay analyzed: an import that stops resolving
# still fails. See NOTES.md -- this is a suppression, not a fix.
ignore = [
  "src/sieve/bench/decoder_benchmark.py",
  "tests/benchmark_image_viewers.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ADR-008: the inner loop is `pytest -m "not slow"`; capability-gated suites
# carry their own markers so a skip is visible rather than silent.
markers = [
  "slow: excluded from the inner loop by default",
  "gpu: requires a working CUDA device and the gpu extra",
  "qt: requires a Qt binding and the dev-gui extra; run by `nox -s test_gui`",
  "gl: requires a GL-capable display, not the offscreen Qt platform",
  "contract: the shared filter-contract suite (ADR-008)",
]
