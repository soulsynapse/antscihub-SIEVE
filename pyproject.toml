[project]
name = "sieve"
version = "0.1.0"
description = "Signal Isolation for Ethological Video Events"
requires-python = ">=3.13,<3.14"
# A dependency arrives with the component that needs it, with the reason for
# the pin next to it — v2's pyproject is the model for that habit, not for this
# list.
dependencies = [
    # `core/types.py` types the frame array it carries, so the shipped package
    # imports numpy from the first module. 2.x because the types name
    # `numpy.typing.NDArray` and `np.dtype[Any]`, both of which changed shape
    # under 2.0's typing rework.
    "numpy>=2.0",
    # `core/tool_base.py`'s params model is a pydantic model: the one field list
    # the GUI, the CLI, YAML, and the cache key all read. 2.x because
    # `model_fields`, `model_dump(mode="json")` and `ConfigDict` are the v2
    # spellings and all three are 2.x-only.
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # scripts/doc_index.py reads item frontmatter; the first dependency, and it
    # arrives with the machinery that needs it.
    "pyyaml",
    "import-linter>=2.13",
    # The synthetic video fixture writes and reads back an mp4. Dev-only and
    # not a runtime dependency because no shipped component decodes anything
    # yet; `sieve.decode` promotes it in Phase 2. Headless because the runner
    # has no display and the GUI build would drag Qt's system libs in behind a
    # contract that forbids them.
    #
    # Pinned below 5.x already: decoder identity feeds cache-key derivation, so
    # a major OpenCV bump changes what a cached result means. Carrying v2's pin
    # from the first install is cheaper than loosening it and re-tightening it
    # when the frames start mattering.
    "opencv-python-headless>=4.10,<5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
