[project]
name = "sieve"
version = "0.1.0"
description = "Signal Isolation for Ethological Video Events"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml",
    "typer",
    "structlog",
    # Pinned below 5.x: the decoder identity feeds cache-key derivation, and a
    # major OpenCV bump changes seek/decode behaviour. Revisit deliberately.
    "opencv-python-headless>=4.10,<5",
    "zarr>=3.0",
    "duckdb",
    "pyarrow",
]

[project.optional-dependencies]
gui = [
    "PySide6",
    "napari",
    "pyqtgraph",
]
gpu = [
    "cupy-cuda12x",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "hypothesis",
    "nox",
    "ruff",
    "pyright",
    "viztracer",
    "py-spy",
    "jaxtyping",
]
dev-gui = [
    "pytest-qt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: excluded from the fast feedback loop",
    "gui: requires the gui extra and a Qt runtime",
    "cuda: requires a CUDA device and the gpu extra",
]
