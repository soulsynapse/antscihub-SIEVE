[project]
name = "sieve"
version = "0.4.0"
description = "SIEVE isolates ethological events from video."
requires-python = ">=3.13"
# numpy is here because the canonical construction is the substrate's
# (`sieve/contract/forms.py`): two producers of one form must agree in the low
# bits, so the shaping cannot live in each tool. It is not a decode library.
#
# av is here for `sieve/chunks.py` and for nothing else: SIEVE's own cut, of
# frames it already held, in a form it named. It never opens a source — which
# container a recording is in stays the tool's opinion, which is the boundary
# ADR-0009 draws. The line to watch is a source suffix or a demux appearing in
# `sieve/`; that is the prohibition, and the dependency is not.
dependencies = [
    "PySide6>=6.8",
    "numpy>=2",
    "av>=13",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
]
# What the bundled tools need and SIEVE does not. A source tool's decoder is
# the tool's dependency, which is what keeps the note below true while a file
# still opens.
tools = [
    "av>=13",
]
# What the experiments compare, which is not what SIEVE runs on. The point
# stands even though `av` is now a runtime dependency: SIEVE picked a codec for
# its own cut, measured
# (`docs/findings/2026.08.21-lossy-intra-beats-lossless-for-the-cut.md`), and
# picked no winner for reading anybody's recording. A contestant installed by
# default would be one the application had chosen to *decode sources* with, and
# it has not — `sieve/` names no container and demuxes nothing.
experiments = [
    "av>=13",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
]

[project.scripts]
sieve = "sieve.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

# One contract per ADR, named for it — the convention is checks/__init__.py.
[tool.importlinter]
root_packages = ["sieve", "checks", "tools"]
contract_types = ["adr0010_key_version: checks.adr0010.KeyVersionContract"]

# ADR-0009's two prohibitions, which fail differently. The first is the one
# nobody violates by accident; the second is the one that happens because the
# internal was right there, and it is the one that freezes the substrate.
[[tool.importlinter.contracts]]
name = "ADR-0009: SIEVE never names a tool"
type = "forbidden"
source_modules = ["sieve"]
forbidden_modules = ["tools"]

[[tool.importlinter.contracts]]
name = "ADR-0009: a tool never reaches past the contract"
type = "forbidden"
source_modules = ["tools"]
forbidden_modules = [
    "sieve.gui",
    "sieve.project",
    "sieve.settings",
    "sieve.relaunch",
    "sieve.registry",
    "sieve.__main__",
]

[[tool.importlinter.contracts]]
name = "ADR-0010: a key carries a version"
type = "adr0010_key_version"
tools_file = "experiments/tool-experiments/tools.py"
baseline_file = "checks/adr0010-baseline.json"
