[project]
name = "sieve"
version = "0.4.0"
description = "SIEVE isolates ethological events from video."
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
sieve = "sieve.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
